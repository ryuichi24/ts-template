name: Clean Artifacts on PR Resolution

on:
  pull_request:
    types:
      - closed

jobs:
  clean_artifacts:
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      actions: write

    steps:
      - name: Clean up artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const prNumber = pr.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            let deletedArtifacts = [];

            const workflowRuns = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              event: 'pull_request',
              per_page: 100,
            });

            for (const run of workflowRuns.data.workflow_runs) {
              if (run.pull_requests.some(pr => pr.number === prNumber)) {
                const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                  owner,
                  repo,
                  run_id: run.id,
                });

                for (const artifact of artifacts.data.artifacts) {
                  // Construct the artifact URL before deletion
                  const artifactUrl = `https://github.com/${owner}/${repo}/actions/runs/${run.id}/artifacts/${artifact.id}`;
                  
                  // Delete the artifact
                  await github.rest.actions.deleteArtifact({
                    owner,
                    repo,
                    artifact_id: artifact.id,
                  });

                  // Store the artifact name and URL
                  deletedArtifacts.push({
                    id: artifact.id,
                    name: artifact.name,
                    url: artifactUrl,
                  });
                }

                console.log(`Cleaned up artifacts for run ID: ${run.id}`);
              }
            }

            // Construct the PR comment with the list of deleted artifacts
            let commentBody = `
            ## 🧹 Build Artifacts Are Cleaned!\n\n
            The following artifacts were deleted after the PR was closed:\n\n`;

            if (deletedArtifacts.length > 0) {
              deletedArtifacts.forEach(artifact => {
                commentBody += `- [${artifact.name} (${artifact.id})](${artifact.url})\n`;
              });
            } else {
              commentBody += `No artifacts were found for this PR.`;
            }

            // Post the comment to the PR
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body: commentBody,
            });

